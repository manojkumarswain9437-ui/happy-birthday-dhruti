<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📸 Beautiful Memories ❤️</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#fff0f5);
overflow:hidden;
font-family:Poppins,sans-serif;
}

.gallery{
text-align:center;
z-index:2;
}

#counter{
font-size:24px;
font-weight:bold;
color:#ff2f7d;
margin-bottom:20px;
}

#photo{
width:380px;
height:380px;
object-fit:cover;
border-radius:25px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
transition:.5s;
animation: zoom 5s infinite alternate;
}

#caption{
margin-top:20px;
font-size:30px;
color:#ff2f7d;
font-weight:bold;
animation: fadeText .5s;
}

.buttons{
margin-top:30px;
}

button{
padding:16px 35px;
margin:10px;
border:none;
border-radius:50px;
background:white;
color:#ff2f7d;
font-size:20px;
cursor:pointer;
box-shadow:0 10px 25px rgba(255,105,180,.3);
}

button:hover{
transform:scale(1.05);
}

.heart,
.flower,
.balloon{
position:absolute;
pointer-events:none;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh);
opacity:0;
}

}
@keyframes zoom{

0%{
transform:scale(1);
}

100%{
transform:scale(1.05);
}

}
@keyframes fadeText{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:translateY(0);

}

}
</style>

</head>

<body>

<audio id="bgMusic" autoplay loop>
<source src="music/birthday-song.mp3" type="audio/mpeg">
</audio>

<div class="gallery">

<div id="counter">
1 / 8 ❤️
</div>

<img id="photo" src="images/panda1.png">

<h2 id="caption">
🌸 Every smile of yours brightens the world
</h2>

<div class="buttons">

<button id="prev">
⬅ Previous
</button>

<button id="next">
Next ➜
</button>

</div>

</div>

<script src="js/gallery.js"></script>

</body>

</html>
